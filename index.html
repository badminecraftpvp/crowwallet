<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><title>CrowWallet</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0d0d;--c:#1a1a1a;--c2:#262626;--m:#8a8a8a;--b:#3d9be9;--g:#3fc14a;--r:#e5484d}
html,body{height:100%;background:#000;color:#fff;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:relative;max-width:480px;height:100dvh;margin:auto;background:var(--bg);overflow:hidden}
.v{position:absolute;inset:0;overflow-y:auto;padding:calc(72px + env(safe-area-inset-top)) 8px 100px;display:none;scrollbar-width:none}
.v.on{display:block;animation:f .25s}@keyframes f{from{opacity:0}}
.card{background:var(--c);border-radius:20px;padding:14px;margin-bottom:8px}
.h{color:var(--b);font-size:14px;margin-bottom:10px}.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}.row>.f{flex:1;min-width:0}.rt{text-align:right}
.tabs{position:absolute;top:calc(10px + env(safe-area-inset-top));left:8px;right:8px;display:flex;align-items:center;gap:10px;z-index:5}
.pill{flex:1;display:flex;background:#1c1c1c;border-radius:30px;padding:4px;position:relative}
.pill button{flex:1;padding:9px 0;border-radius:24px;color:var(--m);z-index:1;transition:.2s}.pill button.on{color:#fff;background:#2a3a4d}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7a8cff,#5a3fd6);display:grid;place-items:center;font-weight:600}
.bar{position:absolute;left:8px;right:8px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar .s{flex:1;background:#1c1c1c;border-radius:30px;padding:14px 16px;display:flex;gap:10px;color:var(--m);align-items:center;box-shadow:0 0 20px #000}
.bar .b{width:52px;height:52px;border-radius:30px;background:#1c1c1c;display:grid;place-items:center;box-shadow:0 0 20px #000}
.big{height:178px;border-radius:22px;background:radial-gradient(circle at 20% 10%,#5fd0ff,#2a8cf0 55%,#2b6fe0);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 4px 18px;position:relative;box-shadow:0 0 30px #1a6ee866;transition:.3s}
.big b{font-size:46px;font-weight:600}.big span{position:absolute;bottom:14px;color:#ffffffaa;display:flex;gap:6px;align-items:center;font-size:14px}
.mini{display:none;text-align:center;margin:0 0 14px}.mini i{display:block;width:44px;height:30px;margin:0 auto 6px;border-radius:7px;background:linear-gradient(135deg,#5fd0ff,#2a6fe0)}.mini b{font-size:40px}.mini b u{text-decoration:none;color:#666}
.sc .big{display:none}.sc .mini{display:block}
.acts{display:flex;justify-content:space-around;margin-bottom:18px}.acts div{text-align:center;color:var(--m);font-size:13px}
.acts i{width:46px;height:46px;border-radius:50%;background:#1c1c1c;display:grid;place-items:center;margin:0 auto 6px;color:#fff}
.lg{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;position:relative;color:#fff}
.lg em{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:#0f8cf0;border:2px solid var(--c)}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#2d2d2d;color:var(--m);margin-left:6px}.apy{font-size:11px;padding:2px 6px;border-radius:6px;background:#12331a;color:#3fe06a;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;text-align:center;font-size:12px}.grid>div{min-width:0}.grid .lg{width:56px;height:56px;margin:0 auto 6px;font-size:22px}.grid div div:last-child{margin-top:2px}
.mv{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.mv>div{flex:0 0 46%;border-radius:20px;padding:16px 8px 0;text-align:center;overflow:hidden}
.scr{position:absolute;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:calc(58px + env(safe-area-inset-top)) 8px 100px;animation:sl .28s cubic-bezier(.2,.8,.2,1)}@keyframes sl{from{transform:translateX(100%)}}
.top{position:absolute;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;padding-inline:14px;font-size:20px;z-index:2;background:var(--bg)}
.top>*{flex:none}.top .t{flex:1;text-align:center}
.sheet{position:absolute;inset:0;z-index:30;background:#000a;display:flex;align-items:flex-end;animation:f .2s}.sheet>div{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:14px 8px 30px;animation:u .3s}@keyframes u{from{transform:translateY(100%)}}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 0;text-align:center;font-size:15px;padding:18px 10px}.q i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px}
.btn{display:block;width:100%;padding:16px;border-radius:30px;text-align:center;background:#2c557d;color:#ffffffbb}
.fix{position:absolute;left:8px;right:8px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:3}
.fix .b1{flex:0 0 46px;height:48px;border-radius:30px;background:#1c1c1c;display:grid;place-items:center}.fix .b2{flex:1;height:48px;border-radius:30px;background:#1c1c1c;color:var(--m)}.fix .b3{flex:1.1;height:48px;border-radius:30px;background:#43c94a;color:#06210a;font-weight:600}
.ch{display:flex;background:#1c1c1c;border-radius:20px;margin:6px 0 10px;padding:4px}.ch button{flex:1;padding:8px;border-radius:16px;color:var(--m);font-size:13px}.ch .on{background:#2a2a2a;color:#fff}
.tg{width:46px;height:28px;border-radius:14px;background:#3b3b3b;position:relative;flex:none;transition:.2s}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#aaa;transition:.2s}.tg.on{background:#2a88e8}.tg.on:after{left:21px;background:#fff}
.vb{display:flex;height:22px;border-radius:5px;overflow:hidden;font-size:12px;margin-top:10px}.vb div{display:flex;align-items:center;padding-left:6px;color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:26px;row-gap:20px;padding:22px 0}
.in{display:flex;justify-content:space-between;align-items:center;gap:8px}.in input{background:none;border:0;outline:0;color:#fff;font:inherit;flex:1;min-width:0}
.chip{background:#262626;border-radius:20px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:14px;color:#fff}
.rc{position:absolute;inset:0;z-index:25;background:linear-gradient(#1a7fa0,#0d0d0d 300px);overflow-y:auto;animation:u .3s}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const P={back:'M19 12H5M12 5l-7 7 7 7',x:'M6 6l12 12M18 6L6 18',up:'M12 19V5M5 12l7-7 7 7',dn:'M6 9l6 6 6-6',plus:'M12 5v14M5 12h14',sw:'M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4',se:'M11 11a6 6 0 1 0 0 .1M16 16l5 5',gl:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',sc:'M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4',qr:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3M20 14v6M14 20h3',ud:'M8 9l4-4 4 4M8 15l4 4 4-4',dl:'M17 7L7 17M7 8v9h9',ur:'M7 17L17 7M8 7h9v9'};
const ic=(n,s=24,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${n=='dots'?'<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>':n=='earn'?'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3 3 7 3s7-1.3 7-3v-5"/>':`<path d="${P[n]}"/>`}</svg>`;
const L={gram:['#2d9cf5','◆'],usdt:['#26a69a','₮'],btc:['#f7931a','₿'],sol:['#111','S'],eth:['#6f7be8','Ξ'],trx:['#e8483f','T'],hyp:['#0f3a33','~'],ltc:['#2d5fb0','Ł'],bch:['#1bb27a','₿'],mw:['#1d8bff','W'],cat:['#c8a47a','🐱'],vine:['#00b489','V'],bnb:['#f3ba2f','B'],avax:['#e84142','A'],doge:['#c2a633','Ð'],zec:['#f4b728','Z'],mon:['#6b4df0','M'],pol:['#8247e5','P']};
const lg=(k,s=40,b)=>`<div class="lg" style="background:${L[k][0]};width:${s}px;height:${s}px;font-size:${s*.45}px">${L[k][1]}${b?'<em></em>':''}</div>`;
const st=['Broadcom|+4.37|#c8102e','Taiwan Se..|-0.57|#e60012','Meta Platf..|-0.53|#e8f0ff','Coinbase|-1.43|#0052ff','Gold xStock|-1.84|#f0c020','Apple|+0.02|#eee','SPDR S&P..|-0.51|#fff','AMD|+0.26|#000'];
const pop=[['btc','Bitcoin','-1.72'],['sol','Solana','+1.06'],['eth','Ethereum','-1.81'],['trx','Tron','+1.11'],['hyp','Hyperliquid','-1.99'],['ltc','Litecoin','-1.65'],['bch','Bitcoin Cash','-1.75'],['mw','My Wallet..','+0.34']];
const cl=v=>v[0]=='-'?'r':'g';
const I={btc:['Bitcoin','$63 862.94','+5.24%','BTC, the native coin of Bitcoin, the first blockchain and the one that settles payments directly between people with no bank in between. Supply is capped at 21 million coins in the protocol itself, and nobody has the authority to raise it. New coins go to miners who spend electricity to add blocks, and that reward halves roughly every four years. Bitcoin was released in 2009 by an author writing as Satoshi Nakamoto, who has never been identified.','$1.3T','20.11M / 20.11M'],
gram:['Gram','$1.02','+16.18%','Gram, the native coin of TON, a proof-of-stake blockchain that Telegram designed, left in 2020 after a settlement with the SEC, and returned to in 2026 as the network\'s largest validator and the driving force of its development. Gram pays for smart-contract execution, for the data contracts keep on chain and for network traffic, and validators stake it to secure the chain and are paid in it. The 2026 rename from Toncoin changed the name only. Holdings and addresses carried over.','$3.07B','2.87B / 5.29B','$2.88M'],
sol:['Solana','$74.17','+1.06%','SOL, the native coin of Solana, a blockchain built for speed: one global state, blocks every 400 milliseconds, and fees small enough that consumer apps and trading bots can run on-chain. Every transaction is paid for in SOL, and holders can delegate it to validators to secure the chain, earning a share of the new SOL the protocol issues on a fixed, declining schedule; transaction fees themselves are partly burned and partly go to the validator that produced the block.','$44.27B','591.74M / 637.74M','$144.25M'],
cat:['Anonymous Cat','$0.019','-13.05%','Anonymous Cat is a Solana token themed around an anonymous cat that collects a 3% transfer tax to fund automatic Zcash rewards for eligible holders. Launched via StonkFun in August 2026, it has distributed over $2.8 million in ZEC rewards to holders with no staking or claiming required.','$21.52M','965.78M / 965.79M','$438.26K'],
eth:['Ethereum','$1 790.22','+1144.88%','ETH, the native coin of Ethereum, the blockchain where most stablecoins, tokenised assets and lending markets are built.','$221.33B','122.23M / 122.23M','$40.59M']};
let stack=[],tab=0,sd=7;
const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
function chart(h=150){sd=11;let p='',y=90;for(let i=0;i<=40;i++){y=Math.max(10,Math.min(120,y+(rnd()-.55)*18));p+=(i?'L':'M')+i*10+' '+y}return`<svg viewBox="0 0 400 ${h}" width="100%" height="${h}" preserveAspectRatio="none"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9be9" stop-opacity=".35"/><stop offset="1" stop-color="#3d9be9" stop-opacity="0"/></linearGradient></defs><path d="${p}L400 ${h}L0 ${h}Z" fill="url(#gg)"/><path d="${p}" fill="none" stroke="#3d9be9" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function qr(k){sd=k.length*97;let s=29,o='';for(let i=0;i<s;i++)for(let j=0;j<s;j++){const f=(a,b)=>a<8&&b<8||a<8&&b>s-9||a>s-9&&b<8;if(f(i,j)||(i>10&&i<18&&j>10&&j<18))continue;if(rnd()>.52)o+=`<rect x="${j}" y="${i}" width="1" height="1" rx=".3"/>`}
const fp=(x,y)=>`<rect x="${x+.5}" y="${y+.5}" width="6" height="6" rx="1.6" fill="none" stroke="#123" stroke-width="1.2"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx="1"/>`;
return`<svg viewBox="0 0 29 29" width="100%" fill="#123c5c">${o}${fp(0,0)+fp(22,0)+fp(0,22)}</svg>`}
const sec=(t,b)=>`<div class="card"><div class="h">${t}</div>${b}</div>`;
const tok=(k,n,sub,r1,r2,x='')=>`<div class="row" ${x}>${lg(k,40,k=='usdt')}<div class="f"><div>${n}</div><div class="m sm">${sub}</div></div><div class="rt"><div>${r1}</div><div class="m sm">${r2}</div></div></div>`;
function home(){return`<div class="big"><b>$0</b><span>CrowWallet ${ic('qr',16)}</span></div><div class="mini"><i></i><b><u>$</u>0</b></div>
<div class="acts">${[['plus','Fund','fund'],['up','Send','send'],['sw','Trade','trade'],['earn','Earn','earn']].map(a=>`<div data-a="${a[2]}"><i>${ic(a[0],22)}</i>${a[1]}</div>`).join('')}</div>
<div class="card" style="padding:6px 14px"><div class="row" data-tk="gram">${lg('gram')}<div class="f"><div>Gram<span class="apy">APY 14.33%</span></div><div class="m sm">$1.02</div></div><div class="rt"><div>0 GRAM</div><div class="m sm">$0</div></div></div>
<div class="row" data-tk="usdt">${lg('usdt',40,1)}<div class="f"><div>Tether USD<span class="tag">TON</span></div><div class="m sm">$1</div></div><div class="rt"><div>0 USD₮</div><div class="m sm">$0</div></div></div></div>
${sec('Activity','<div style="text-align:center;padding:50px 0"><div>No Activity</div><div class="m sm" style="margin-top:6px">There is no activity history in this wallet yet.</div></div>')}
${sec('Explore',`<div class="row" data-t="1"><div class="lg" style="background:#7a6cf0;border-radius:10px">▥</div><div><div>Market</div><div class="m sm">Trade crypto and real-world assets</div></div></div><div class="row" data-t="3"><div class="lg" style="background:#f0803a;border-radius:10px">◎</div><div><div>Apps</div><div class="m sm">Explore decentralized internet</div></div></div>`)}`}
function market(){const mv=(k,n,p,c,col)=>`<div data-tk="${k}" style="background:${col}"><div style="position:relative;width:36px;margin:auto">${lg(k,36,1)}</div><div style="margin:8px 0 2px">${n}</div><div class="sm"><span class="m">${p}</span> <span class="${cl(c)}">${c}%</span></div><div style="margin:6px -8px 0">${chart(50)}</div></div>`;
return`<div class="h" style="margin:4px 8px 8px">Today's Movers</div><div class="mv">${mv('cat','Anonymous Cat','$0.019','-13.05','#142230')+mv('vine','Vine Coin','$0.0068','-11.53','#102a22')}</div>
<div style="height:8px"></div>${sec('Popular Tokens <span class="m" style="float:right">See All</span>',`<div class="grid">${pop.map(p=>`<div data-tk="${p[0]}">${lg(p[0])}<div>${p[1]}</div><div class="${cl(p[2])}">${p[2]}%</div></div>`).join('')}</div>`)}
${sec('Tokenized Stocks <span class="m" style="float:right">See All</span>',`<div class="grid">${st.map(s=>{const[n,c,bg]=s.split('|');return`<div><div class="lg" style="background:${bg};border-radius:14px;color:#000;font-size:15px">${n[0]}</div><div>${n}</div><div class="${cl(c)}">${c}%</div></div>`}).join('')}</div>`)}
${sec('Tokenized Gold',`${tok('gram','XAUT <span class="tag" style="color:#f5b73c">Tether Gold</span>','$3 776.24 <span class="r">-1.56%</span>','','')}`)}`}
function agent(){return`<div class="card" style="display:flex;gap:12px;align-items:center"><div class="lg" style="background:#5a52f0;border-radius:12px;width:44px;height:44px">∿</div><div class="f"><b>News</b><div class="m sm">Scattered Spider hacker gets 6 years for $11.6 million crypto theft</div></div><span class="m sm">8:29 PM</span></div>
<div style="height:34vh"></div><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">${['What can you do?','How do swaps work?','What is staking?','How do I protect my wallet?','🎧 Contact support'].map(t=>`<div style="padding:9px 14px;border-radius:20px;background:#1a2438;border:1px solid #3a4a70">${t}</div>`).join('')}</div>`}
function apps(){const f=[['Spot Trading',['#2b7fff','#f5b800']],['Advanced DeFi',['#111','#3a1cf5']],['NFT',['#1f6bff','#1a1f2a','#2a6bff']],['DYOR',['#111','#2c7fff','#2a64d8']],['Utilities',['#3a8cff','#d33','#1a1a1a']],['Games',['#2a2f3a','#2a7fff','#f5b800']]];
return`<div class="card"><div class="h">Happening Now</div><div style="background:#0a0a0a;border-radius:16px;padding:16px"><b style="font-size:20px;display:block;width:60%">Send &amp; Receive Crypto or Collectibles via ✈ Telegram</b><div class="row" style="margin-top:14px">${lg('usdt',48)}<div><b>@push</b> <span style="color:#3d9be9">✔</span><div class="m sm">Send crypto &amp; NFTs in any Telegram chat</div></div></div></div></div>
<div class="card"><div class="h">Popular Apps</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${f.map(x=>`<div data-f="${x[0]}" style="text-align:center"><div style="background:#242424;border-radius:20px;height:130px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start">${x[1].map(c=>`<div style="background:${c};border-radius:12px;aspect-ratio:1"></div>`).join('')}</div><div style="margin-top:6px;font-size:13px">${x[0]}</div></div>`).join('')}</div></div>`}
function draw(){A.innerHTML=`<div class="tabs"><div class="pill" id="pill"></div><div class="av" id="prof">C</div></div>${[home,market,agent,apps].map((f,i)=>`<div class="v" id="v${i}">${f()}</div>`).join('')}<div class="bar"><div class="s">${ic('se',20)}Search or Ask</div><div class="b">${ic('sc',22)}</div><div class="b" id="pl">${ic('plus',24)}</div></div>`;setTab(tab);bind(A);
$('#v0').onscroll=e=>$('#v0').classList.toggle('sc',e.target.scrollTop>60);$('#prof').onclick=()=>push(profile());$('#pl').onclick=()=>sheet(`<div class="q">${[['Buy','#f0a030','▭'],['Fund','#5cc65c','↙'],['Trade','#b060e0','⟳'],['Sell','#e05050','$'],['Send','#3aa0e8','↗'],['Earn','#6a5ae0','◉'],['Scan','#888','⛶']].map(a=>`<div data-a="${a[0].toLowerCase()}"><i style="background:${a[1]};color:#fff;font-size:24px">${a[2]}</i>${a[0]}</div>`).join('')}</div>`)}
function setTab(i){tab=i;const n=['Wallet','Market','Agent','Apps'],o=i<3?0:1;$('#pill').innerHTML=n.slice(o,o+3).map((t,j)=>`<button class="${o+j==i?'on':''}" data-t="${o+j}">${t}</button>`).join('');document.querySelectorAll('.v').forEach((v,j)=>v.classList.toggle('on',j==i));$('#pill').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(+b.dataset.t))}
function bind(r){r.querySelectorAll('[data-tk]').forEach(e=>e.onclick=()=>push(token(e.dataset.tk)));r.querySelectorAll('[data-t]').forEach(e=>e.tagName!='BUTTON'&&(e.onclick=()=>setTab(+e.dataset.t)));r.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{closeS();const a=e.dataset.a;push(a=='fund'?recv():a=='trade'?trade():a=='earn'?trade():send())});r.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>push(folder(e.dataset.f)));r.querySelectorAll('.back').forEach(e=>e.onclick=pop);r.querySelectorAll('[data-rc]').forEach(e=>e.onclick=()=>push(recv()));r.querySelectorAll('.tg').forEach(e=>e.onclick=()=>e.classList.toggle('on'))}
function push(h){const d=document.createElement('div');d.className=h.rc?'rc':'scr';d.innerHTML=h.h;A.appendChild(d);stack.push(d);bind(d);h.i&&h.i(d)}
function pop(){const d=stack.pop();d&&d.remove()}
function sheet(h){closeS();const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div>${h}</div>`;s.onclick=e=>e.target==s&&closeS();A.appendChild(s);bind(s)}
function closeS(){document.querySelectorAll('.sheet').forEach(s=>s.remove())}
const top=(t,l='back',r='')=>`<div class="top"><button class="${l=='back'?'back':'back'}">${ic(l=='x'?'x':'back')}</button><div class="t">${t}</div><span style="width:24px">${r}</span></div>`;
function token(k){const d=I[k]||[k,'$1','+0%','Native token on its blockchain.','$—','—','$—'],pos=d[2][0]!='-';let open=false;
const h=`${top('')}<div class="card" id="pc"><div class="row" style="padding:0">${lg(k=='cat'?'cat':k,36)}<div class="f"><span class="m sm">Price</span><div>${d[1]} <span class="${pos?'g':'r'} sm">${d[2]}</span></div></div><button id="ex">${ic('dn',22)}</button></div><div id="chp" style="display:none"><div style="margin:8px -14px">${chart(150)}</div><div class="ch">${['All','Y','3M','M','W','D'].map((t,i)=>`<button class="${i==0?'on':''}">${t}</button>`).join('')}</div></div></div>
<div class="card"><div class="m sm">Info</div><div id="info" style="margin-top:6px;line-height:1.35">${d[3]}</div><div style="margin:8px 0;color:var(--b)">Show Less</div><div style="display:flex;gap:8px"><span class="chip">${ic('gl',16)}Website</span></div>
<div class="row"><span class="m f">Market Cap ⓘ</span>${d[4]}</div><div class="row"><span class="m f">Circulating / Total Sup… ⓘ</span>${d[5]}</div>${d[6]?`<div class="row"><span class="m f">Volume · 24h ⓘ</span>${d[6]}</div><div class="vb"><div style="background:#3fc14a;flex:1">$${'1.49M'}</div><div style="background:#e5484d;flex:1">$1.39M</div></div>`:''}</div>
${sec('','<div style="text-align:center;padding:30px 0"><div>No Activity</div><div class="m sm" style="margin-top:6px">There is no activity history in this wallet yet.</div></div>').replace('<div class="h"></div>','')}
<div class="fix"><button class="b1">${ic('se',20)}</button><button class="b2" data-rc>Receive</button><button class="b3" data-b="${k}">Buy</button></div>`;
return{h,i:d2=>{d2.querySelector('#ex').onclick=()=>{const c=d2.querySelector('#chp');c.style.display=c.style.display=='none'?'block':'none'};d2.querySelector('.b3').onclick=()=>push(buy(d[0]));d2.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>{d2.querySelectorAll('.ch button').forEach(x=>x.classList.remove('on'));b.classList.add('on')})}}}
function recv(){const ch=[['TON','gram','My TON Address','UQAQUjojXgxnmgUUOCVQvq5LFfM8gFy3H_JNfTZWGC6nGIJs','#1b7fc8'],['Bitcoin','btc','My BTC (Bitcoin) Address','bc1pckz0zudxm7uxvqn9azyt7lp4jzvjk53vlt70l4n3686s828gcvss885ktx','#c47a20'],['Ethereum','eth','My Ethereum Address','0xdaD0f99dfC8245D008f3ff88AC3efD4A3025','#4a4a9a'],['Solana','sol','My Solana Address','84TrSMtle1mP9c3VFQwxyzE3vR8hJkUnBq2aLd7NpXs','#3a3a5a'],['Litecoin','ltc','My Litecoin Address','ltc1prxyhy4w4ytgxeaepnjp5ym26c20dccrm9tg3gmw4v0ta8vwzflqf4w2jm','#2a4f8a'],['Zcash','zec','My Zcash Address','t1RZR8ZFnuD9xafmnoJz5VQFgfw8zF2VMaA','#a8791c']];
const h=`<div style="position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:10px;align-items:center;z-index:2"><div class="pill" id="cp" style="background:#ffffff22;overflow-x:auto;scrollbar-width:none">${ch.map((c,i)=>`<button class="${i?'':'on'}" style="flex:none;padding:9px 16px" data-i="${i}">${c[0]}</button>`).join('')}</div><button class="back">${ic('x')}</button></div><div id="rb"></div>`;
const ren=(d,i)=>{const c=ch[i];d.style.background=`linear-gradient(${c[4]},#0d0d0d 300px)`;d.querySelector('#rb').innerHTML=`<div style="padding:calc(76px + env(safe-area-inset-top)) 40px 0"><div style="background:#fff;border-radius:34px;padding:22px;position:relative">${qr(c[0])}<div class="lg" style="position:absolute;left:50%;top:50%;margin:-22px;width:44px;height:44px;background:#fff;border:3px solid #fff"><div class="lg" style="background:${L[c[1]][0]}">${L[c[1]][1]}</div></div></div></div><div style="height:22px"></div><div class="card" style="margin-top:0"><div class="h">${c[2]}</div><div style="display:flex;gap:10px;align-items:flex-start"><div class="f" style="word-break:break-all;font-size:16px;line-height:1.35;color:#ffffffb0">${c[3]}</div><span style="color:var(--b)">${ic('gl',24)}</span></div><div class="m sm" style="margin-top:10px">Send only ${c[0]=='TON'?'GRAM or TON-based assets':c[0]} to this address. Sending other tokens will result in loss.</div></div><div class="card" style="color:var(--b);line-height:3">Buy with Card<br>Buy with Crypto<br>${i?'':'Create Deposit Link'}</div>`;d.querySelectorAll('#cp button').forEach(b=>b.classList.toggle('on',b.dataset.i==i))};
return{rc:1,h,i:d=>{ren(d,0);d.querySelectorAll('#cp button').forEach(b=>b.onclick=()=>ren(d,+b.dataset.i))}}}
function buy(n){let v='0';const h=`<div class="top" style="background:none"><div class="av" style="width:34px;height:34px">C</div><span></span><button class="back">${ic('x')}</button></div><div class="card" style="height:200px;margin-top:-6px"><div class="chip" style="width:fit-content;color:var(--m)">0 ${n=='Bitcoin'?'BTC':n} ⇅</div><div id="amt" style="font-size:54px;font-weight:600;margin-top:20px;color:#ccc"><span class="m">$</span>0</div></div><div class="card row" style="padding:12px"><div class="lg" style="background:#4cc050;width:30px;height:30px">$</div><div class="f">You Pay</div><span class="m">USD ⇅</span></div><div class="btn" style="background:#2e7d32;color:#cfe">Buy ${n=='Bitcoin'?'BTC':n} via MoonPay</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'.',0,''].map(k=>`<div data-k="${k}">${k}</div>`).join('')}</div>`;
return{h,i:d=>d.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{const k=e.dataset.k;if(!k)return;v=v=='0'&&k!='.'?k:v+k;d.querySelector('#amt').innerHTML=`<span class="m">$</span>${v}`})}}
function send(){return{h:`<div class="top" style="background:none"><span class="chip" style="margin:auto 0 auto 40%">Send ⇅</span><span class="m" style="margin-right:auto;margin-left:14px">Sell</span><button class="back">${ic('x')}</button></div>
${sec('Send to','<div class="in"><input placeholder="Address or Domain"><span style="color:var(--b)">Paste</span><span style="color:var(--b)">'+ic('sc',22)+'</span></div>')}
<div class="card"><div class="h in" style="margin:0 0 6px"><span>Amount</span><span class="m sm">Max: <span style="color:var(--b)">0 GRAM</span></span></div><div class="in"><input placeholder="0" inputmode="decimal"><span class="chip" data-sel>${lg('gram',22)}GRAM ⇅</span></div><div class="m sm" style="margin-top:14px">$0 ⇅</div></div>
<div class="card"><div class="h">Comment or Memo ▾</div><input placeholder="Add a message, if needed" style="background:none;border:0;outline:0;color:#fff;font:inherit;width:100%"></div><div class="fix"><div class="btn" style="flex:1">Enter Address</div></div>`,i:d=>d.querySelector('[data-sel]').onclick=()=>push(sel())}}
function sel(){const l=[['gram','Gram','GRAM'],['usdt','Tether USD','USD₮'],['btc','Bitcoin','BTC'],['eth','Ethereum','ETH'],['mon','Monad','MON'],['pol','Polygon','POL'],['sol','Solana','SOL'],['trx','Tron','TRX']];return{h:`${top('Select Token')}<div class="card" style="padding:12px 16px;display:flex;gap:10px;color:var(--m)">${ic('se',20)}Search...</div>${l.map(t=>`<div class="row" style="padding:10px 6px">${lg(t[0],40,t[0]=='usdt')}<div class="f">${t[1]}<div class="m sm">${t[1]}</div></div><div class="rt">0 ${t[2]}<div class="m sm">$0</div></div></div>`).join('')}`}}
function trade(){return{h:`${top('Trade','x')}<div class="card"><div class="in m sm"><span>You Sell</span><span>Max: <span style="color:var(--b)">0 GRAM</span></span></div><div class="in" style="margin:8px 0"><input placeholder="0" inputmode="decimal"><span class="chip">${lg('gram',22)}GRAM ⇅</span></div><div style="text-align:center;margin:-4px 0"><i style="display:inline-grid;width:34px;height:34px;border-radius:50%;background:#10253a;place-items:center;color:var(--b)">${ic('ud',18)}</i></div><div class="m sm">You Buy</div><div class="in" style="margin-top:8px"><input placeholder="0" inputmode="decimal"><span class="chip">${lg('usdt',22)}USD₮ ⇅</span></div></div>
<div class="card in">Swap Details${ic('dn',20)}</div><div style="border-left:3px solid #f5a623;background:#2a2012;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center"><div class="f"><div style="color:#f5a623">Add funds to swap</div><div class="m sm">Buy with a card or receive crypto to fund this swap.</div></div><span style="background:#3a2a10;color:#f5a623;border-radius:14px;padding:6px 14px" data-rc>Fund</span></div><div class="fix"><div class="btn" style="flex:1">Enter Amount</div></div>`}}
function folder(n){const l={'Spot Trading':[['STON.fi','Exchange TON assets with minimal slippage','#2b7fff'],['DeDust','Provide liquidity and earn rewards across TON pools','#f5b800']],NFT:[['My Wallet Cards NFT','Personalize your wallet with collectible cards','#1f6bff'],['Fragment','Buy and trade Telegram @usernames, anonymous','#1a1f2a'],['Getgems','First TON NFT marketplace','#2a6bff'],['Portals ✈','Browse and trade Telegram Gifts','#111'],['Tonnel Relayer Bot ✈','Trade Telegram Gifts without onchain fees','#222']]}[n]||[['Coming soon','Nothing here yet','#333']];
return{h:`${top(n)}<div class="card" style="padding:6px 14px">${l.map(a=>`<div class="row"><div class="lg" style="background:${a[2]};border-radius:12px;width:46px;height:46px"></div><div class="f"><div>${a[0]}</div><div class="m sm">${a[1]}</div></div><span style="background:#262626;border-radius:16px;padding:7px 16px">Open</span></div>`).join('')}</div>`}}
function profile(){const it=[['Portfolio','Performance, insights and P&amp;L','#3fc14a','▮'],['Appearance','Night Mode, Palette, Card','#2b9cf0','◐'],['Security','Back Up, Passcode, Auto-Lock','#3fc14a','⚿'],['Assets & Activity','Base Currency, Token Order, Hidden NFTs','#3d6bf0','▦'],['Subwallets','Other addresses for this wallet','#f5a623','▭'],['Wallet Versions','Your assets on other TON contracts','#1f8cf0','◈'],['Notifications & Sounds','Wallets, Sounds','#e5484d','🔔'],['Language','','#8a4cf0','文']];
const row=a=>`<div class="row" data-p="${a[0]}"><div class="lg" style="background:${a[2]};border-radius:10px;width:34px;height:34px;font-size:16px">${a[3]}</div><div><div>${a[0]}</div><div class="m sm">${a[1]}</div></div></div>`;
return{h:`<div class="top" style="background:none"><button class="back">${ic('back')}</button><span style="margin-left:auto;margin-right:18px">${ic('qr')}</span><span id="dt">${ic('dots')}</span></div><div class="row" style="padding:10px 8px"><div class="av" style="width:72px;height:72px;font-size:28px">C</div><div><div style="font-size:22px">CrowWallet</div><div class="m">$0</div></div></div>
<div class="h" style="margin:14px 14px 8px">Wallets</div><div class="card" style="padding:4px 14px"><div class="row">${ic('plus',24,1.6)}<span data-add>Add Wallet</span></div></div><div class="card" style="padding:4px 14px">${row(it[0])}</div><div class="h" style="margin:14px 14px 8px">Settings</div><div class="card" style="padding:4px 14px">${it.slice(1).map(row).join('')}</div>`,
i:d=>{d.querySelector('#dt').onclick=()=>{const m=document.createElement('div');m.style.cssText='position:absolute;right:12px;top:50px;background:#262626;border-radius:16px;padding:8px 16px;z-index:5;line-height:3';m.innerHTML='✎ Rename Wallet<br>⇥ Remove Wallet';m.onclick=()=>m.remove();d.appendChild(m)};d.querySelector('[data-add]').onclick=()=>sheet(`<div class="in" style="padding:6px 8px 14px;font-size:20px">Add Wallet<button onclick="closeS()">${ic('x')}</button></div><div class="card" style="padding:4px 14px">${[['New Wallet','From new secret words'],['New Subwallet','From current secret words']].map(a=>`<div class="row"><span>▭</span><div><div>${a[0]}</div><div class="m sm">${a[1]}</div></div></div>`).join('')}</div><div class="m" style="text-align:center;margin:10px">or import from</div><div class="card" style="padding:4px 14px">${[['12/24 Secret Words','Restore wallet from 12 or 24 words'],['Ledger','Connect your hardware wallet'],['View Any Address','Watch wallet in read-only mode']].map(a=>`<div class="row"><span>⚿</span><div><div>${a[0]}</div><div class="m sm">${a[1]}</div></div></div>`).join('')}</div>`);
d.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{const p=e.dataset.p;if(p=='Portfolio')push(port());if(p=='Assets & Activity')push(assets())})}}}
function port(){return{h:`${top('Portfolio')}${sec('Overview','<div class="row" style="justify-content:space-between;align-items:flex-start"><div><b>$0</b><div class="m sm">Total Balance</div></div><div><b>+$0</b><div class="m sm">Net Change</div></div></div>')}<div style="display:flex;gap:8px"><div class="card f" style="height:240px;flex:1"><div class="h">By Chain</div><div class="m" style="text-align:center;margin-top:70px">No chain balances</div></div><div class="card" style="height:240px;flex:.6"><div class="h">Asset M…</div></div></div>${sec('Portfolio Share','<div class="m" style="text-align:center;padding:90px 0 50px">No data</div><div class="ch">'+['All','Y','3M','M','W','D'].map((t,i)=>`<button class="${i==1?'on':''}">${t}</button>`).join('')+'</div>')}`}}
function assets(){const tg=(k,n,on)=>`<div class="row"><div class="f">${n}</div><div class="tg ${on?'on':''}"></div></div>`;
return{h:`${top('Assets & Activity')}<div class="card"><div class="row"><div class="f">Base Currency</div><span class="m">USD</span></div>${tg(0,'Hide Tiny Transfers and Spam',1)}</div><div class="m sm" style="margin:0 14px 12px">Don't show transactions of less than $0.01. Such small transactions are often used for spam and scam.</div><div class="card">${tg(0,'Hide Unverified NFTs',1)}<div class="row">Hidden NFTs</div></div>${sec('Blockchains',`<div class="row">${lg('gram',30)}<div class="f"></div>${ic('back',18).replace('<svg','<svg style="transform:rotate(180deg)"')}</div>`)}<div class="card">${tg(0,'Blockchain Badges')}</div><div class="card">${tg(0,'Hide Tokens With No Cost',1)}<div class="row"><div class="f">Change % Threshold</div><span class="chip">1.5% ⇅</span></div></div>
${sec('Tokens on Home Screen',`<div class="row" style="color:var(--b)">${ic('plus',20)}Add Token</div>${[['gram','Gram',1],['usdt','Tether USD',1],['avax','Avalanche',0],['bnb','BNB',0],['btc','Bitcoin',0],['doge','Dogecoin',0]].map(t=>`<div class="row">${lg(t[0],40,t[0]=='usdt')}<div class="f">${t[1]}<div class="m sm">$0</div></div><div class="tg ${t[2]?'on':''}"></div></div>`).join('')}`)}`}}
draw();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
